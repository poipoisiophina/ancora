; ancora driver config. The driver re-reads it within 250 ms while SteamVR runs.
[ancora]
; master switch, 0 = pass all input through unchanged
enable=1
; per hand: correct the stick (1 = on), thumb gate (thumb off the cap -> 0,0),
; moving average for a shaky stick (0..300 ms, 0 = off, adds lag),
; radial deadzone while touched (0..0.95, 0 = off)
left=1
left_touch_gate=1
left_average_ms=0
left_deadzone=0.00
right=0
right_touch_gate=1
right_average_ms=0
right_deadzone=0.00
; panel language: auto follows Windows, or a code such as de, ar, ja, zh-Hant
language=auto

# Builds ancora on pushes to main and on pull requests: package.bat runs
# build_driver.bat all (driver tests, panel self test; any failure fails the job)
# and packs the installer. Windows runners count double against private repo
# minutes, so: main and PRs only (a PR branch push is not built twice), a newer
# push cancels the older run, docs-only changes are skipped, a hung run stops
# after 20 minutes, and artifacts are kept 7 days.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # the output also goes to package.log and into the test-logs artifact: job logs
      # need a GitHub sign in to read, artifacts of a public repo do not
      - name: Build, test and package
        shell: cmd
        run: |
          call package.bat > package.log 2>&1
          set RC=%ERRORLEVEL%
          type package.log
          exit /b %RC%
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            package.log
            driver/obj/ancora_test.log
            driver/obj/panel_test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: ancora-setup
          path: dist/*.exe
          retention-days: 7
